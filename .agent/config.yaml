# Central configuration for the autonomous engineering workflow (scripts/agent_team/).
#
# Every tunable of the orchestrator lives here — nothing is hard-coded across the scripts.
# Values were chosen conservatively for the machine discovered in Phase 0 (Apple M1 Pro,
# 10 cores, 32 GiB, shared with interactive Claude sessions that routinely run their own
# regression sweeps). Raise concurrency only after the system has proven stable.
version: 1

github:
  repo: tzahibe/BuildSmart          # origin still says "sddproject"; GitHub redirects the rename
  base_branch: main
  poll_interval_seconds: 120
  # Any of these labels makes an open Issue a candidate; authorization is then decided per Issue:
  # owner:approved = ROOT (the owner's product goal, executed in full), agent:queued = a ROOT or a
  # child the Team Lead queued (a child inherits authorization from its owner-approved ROOT).
  poll_labels: [agent:queued, owner:approved]
  # Trust boundary: only Issues opened by these author associations are executable. Any other
  # author's Issue is ignored even if it carries the labels (labels can be added by anyone with
  # triage, the body is untrusted text).
  executable_author_associations: [OWNER, MEMBER, COLLABORATOR]
  merge_method: squash              # squash | merge
  delete_branch_after_merge: true
  ci_wait_seconds: 9000             # give up waiting for checks after 150 min -> INFRA_FAILURE (gate-4 may take ~110 min cold)
  ci_poll_interval_seconds: 60
  # Deterministic CI: the aggregate GitHub Actions check (agent-ci.yml's last job). It fails when
  # any gate failed and passes when gate-4 was legitimately skipped for a non-regression PR.
  ci_required_checks: ["agent-ci-result"]
  # Independent review: a commit STATUS the orchestrator publishes on the validated head SHA after
  # gate 5 — success only when the reviewer APPROVEd that exact SHA, failure on REQUEST_CHANGES /
  # BLOCK, pending otherwise. A new SHA has no status, i.e. the review is stale until it re-runs.
  review_status_context: "agent-review-result"
  # Branch protection (`agentctl protect-main`) requires ci_required_checks + review_status_context.
  # The admin exemption is break-glass only: the orchestrator never merges unless every required
  # context is green on GitHub, and reconciliation records any bypass / protection drift.
  protect_enforce_admins: false
  # Individual gate jobs, reported and used for failure classification.
  gate_checks:
    - "gate-1-contract / contract"
    - "gate-2-static"
    - "gate-3-verification"
    - "gate-4-regression / regression"

paths:
  worktree_root: .worktrees         # gitignored; one directory per Issue
  branch_prefix: agent/             # agent/<issue>-<slug>
  state_dir: .agent/state           # SQLite state store + orchestrator lock
  logs_dir: .agent/logs             # structured run records (redacted)
  contracts_dir: .agent/contracts   # snapshot of each parsed Issue contract + verification manifest

models:
  master_team_lead: opus
  domain_lead: sonnet
  worker: sonnet
  reviewer: sonnet

claude:
  # "auto" resolves: $CLAUDE_BIN, then `claude` on PATH, then the newest VS Code extension binary.
  binary: auto
  effort: high
  worker_timeout_seconds: 3600
  repair_timeout_seconds: 2400
  reviewer_timeout_seconds: 1200
  domain_lead_timeout_seconds: 1200
  heartbeat_interval_seconds: 30
  # A WORKING issue whose heartbeat is older than this and whose process is gone is stale.
  stale_after_seconds: 900
  worker_permission_mode: acceptEdits
  # Least privilege: the worker edits files and runs tests in its own worktree only. Pushing,
  # PR creation, branch switching and any GitHub access are done by the orchestrator, never by
  # the model. `--permission-prompts none` means anything outside this list is denied, not asked.
  worker_allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - Skill
    - "Bash(git status*)"
    - "Bash(git diff*)"
    - "Bash(git log*)"
    - "Bash(git add *)"
    - "Bash(git commit *)"
    - "Bash(git show*)"
    - "Bash(uv run pytest*)"
    - "Bash(uv run python*)"
    - "Bash(uv sync*)"
    - "Bash(.venv/bin/pytest*)"
    - "Bash(.venv/bin/python*)"
    - "Bash(npm test*)"
    - "Bash(npm run *)"
    - "Bash(npx vitest*)"
    - "Bash(npx tsc*)"
    - "Bash(ls*)"
    - "Bash(cat *)"
    - "Bash(head *)"
    - "Bash(tail *)"
    - "Bash(wc *)"
    - "Bash(grep *)"
    - "Bash(find *)"
    - "Bash(sed -n *)"
  worker_disallowed_tools:
    - "Bash(git push*)"
    - "Bash(git checkout*)"
    - "Bash(git switch*)"
    - "Bash(git reset*)"
    - "Bash(git rebase*)"
    - "Bash(git merge*)"
    - "Bash(git stash*)"
    - "Bash(git worktree*)"
    - "Bash(git branch -D*)"
    - "Bash(gh *)"
    - "Bash(rm -rf*)"
    - "Bash(curl *)"
    - "Bash(wget *)"
    - WebFetch
    - WebSearch
    - Agent
  # The reviewer never runs code: read-only file tools plus the diff/evidence in its prompt.
  reviewer_tools: [Read, Grep, Glob]
  domain_lead_tools: [Read, Grep, Glob]

resources:
  max_worker_agents: 3              # raised 2->3 on 2026-09-17 with the owner's permission (M1 Pro 10c/32GB); usage guard live
  max_reviewer_agents: 1
  max_domain_leads: 1
  weighted_capacity: 7              # sum of weights of running agent jobs (HEAVY 3 + MEDIUM 2 + MEDIUM 2)
  weights: {LIGHT: 1, MEDIUM: 2, HEAVY: 3}
  cpu_threshold_percent: 75         # do not spawn when the machine-wide CPU is above this
  min_free_memory_gb: 6
  probe_window_seconds: 3           # CPU sampling window
  # Heavy validation (full pytest, corpus regression, sweeps) uses its own pool so that agent
  # slots being free never means "run three regression sweeps at once".
  heavy_job_concurrency: 1
  heavy_job_stale_after_seconds: 5400

locks:
  # Semantic domain locks. An Issue declares which it needs, exclusive or shared.
  known:
    - planner-core
    - geometry-core
    - validator-core
    - requirements-parser
    - knowledge-index
    - frontend-review
    - database-schema
    - ci-infra
    - docs
  # Domain -> locks implied when the Issue does not spell them out.
  implied_by_domain:
    geometry: [geometry-core]
    validator: [validator-core]
    backend: [planner-core]
    knowledge: [knowledge-index]
    frontend: [frontend-review]
    infra: [ci-infra]
  stale_after_seconds: 7200

repair:
  max_attempts: 2                   # automatic repair attempts after a red CI before agent:blocked

# Subscription usage guard (owner rule, 2026-09-17): `claude -p /usage` is probed every tick (free);
# at pause_at_percent (session or week) the scheduler pauses itself — no new claims, workers,
# repairs or reviews — the owner is told on Telegram, and it resumes by itself once the window
# resets / usage falls below resume_below_percent. A run that dies on a rate limit is requeued
# without consuming a repair attempt.
# Weekend / Jewish-holiday autonomous integration mode (owner governance §26–§41). During a
# protected period the Team Lead merges fully validated PRs into ONE temporary integration
# branch (integration/weekend-<date> or integration/holiday-<name>-<year>) and, when it ends,
# opens ONE rollup PR to main that is validated as a whole. main is never merged autonomously.
protected_periods:
  enabled: true
  timezone: Asia/Jerusalem
  weekdays: [fri, sat]
  # keys: yom_kippur, sukkot (incl. Chol HaMoed), shemini_atzeret, shavuot, rosh_hashanah, pesach
  holidays: [yom_kippur, sukkot, shemini_atzeret, shavuot]
  erev: true                          # the period starts on Erev Chag
usage_guard:
  enabled: true
  pause_at_percent: 98
  resume_below_percent: 90
  probe_every_seconds: 120

# Rolling backlog (owner rule): when every queued/active roadmap Issue has finished, the next
# `batch_size` roadmap topics are drafted as agent:draft Issues (with a knowledge check) and the
# owner is asked to approve them. Drafts only — nothing runs without owner:approved.
roadmap:
  file: docs/ROADMAP.md
  auto_next_batch: true
  batch_size: 5

# Governance (owner-controlled backlog): every risk level ends at agent:ready-for-owner once its
# requirements hold; the orchestrator recommends and NEVER merges. auto_merge must stay false —
# the loader refuses a config that sets it true. Only the owner merges (Telegram CONFIRM MERGE or
# the GitHub Merge button), and only the owner sets owner:approved on an Issue.
risk_policy:
  LOW:
    requires: [ci_green, regression_green, reviewer_green]
    auto_merge: false
    regression: required_if_backend   # regression gate still runs when backend code changed
  MEDIUM:
    requires: [ci_green, regression_green, reviewer_green]
    auto_merge: false
    regression: required_if_backend
  HIGH:
    requires: [ci_green, regression_green, reviewer_green]
    auto_merge: false
    regression: always

governance:
  # GOVERNANCE (owner rule, 2026-09-18): the owner defines the product backlog by creating/approving
  # ROOT Issues (this label; only the owner adds it — Telegram "approve"/"Create & Queue" or GitHub).
  # Once a ROOT exists the Team Lead executes it in full without further approval: claim, queue,
  # decompose into child Issues (authorization inherited — `### Authorization` section, agent:child),
  # workers, branches/worktrees, PRs, CI, regression, review, repair, base updates. The ONLY
  # owner-only action is MERGE TO MAIN (no auto-merge at any risk). `agent:hold` (owner) parks an
  # authorized Issue.
  owner_approval_label: owner:approved
  # Concurrency: the owner sets the maxima (resources.max_worker_agents, weighted_capacity,
  # heavy_job_concurrency above); within them the Team Lead/scheduler uses every slot that is safe.
  # max_active_issues counts ROOT Issues with work in flight (children count toward their ROOT;
  # READY_FOR_OWNER does not count — a PR waiting for the owner never stops unrelated work).
  max_active_issues: 3
  # When an Issue's domain locks are released: pr_open (the code changes are done — CI/review hold
  # nothing, the next Issue on the same core starts at once; a repair re-acquires the locks first;
  # conflicts surface as base updates), ready (held through CI/review, released at READY_FOR_OWNER),
  # merge (held until the merge — serializes on owner latency). Owner rule 2026-09-18: never let a
  # worker rest -> pr_open.
  release_locks_at: pr_open
  # SIGTERM / `agentctl stop` / launchd restart drain: running agents finish (up to this many
  # seconds), nothing new starts, then the process exits. SIGINT or a second SIGTERM = stop now.
  drain_timeout_seconds: 3900

remote_control:
  telegram:
    enabled: true
    mode: long_polling            # V1: the orchestrator machine polls api.telegram.org; no inbound port
    token_env: AGENT_TELEGRAM_BOT_TOKEN
    # Optional KEY=VALUE file (chmod 600) loaded into the remote service's environment only, so the
    # bot token never has to live in a shell profile. Never committed, never printed.
    env_file: ~/.agent-team/telegram.env
    poll_timeout_seconds: 30
    pairing_ttl_seconds: 600
    merge_confirmation_ttl_seconds: 600
    # Two-tier interpretation for fast replies: every message is first classified by the fast model
    # (no tools, a few seconds); only drafting/answering actions then run the Team Lead model with
    # read-only repository access.
    interpreter_fast_model: sonnet
    interpreter_model: opus       # drafts and evidence-based answers (read-only tools)
    interpreter_timeout_seconds: 240
    interpreter_fast_timeout_seconds: 60
    transcription_provider: none  # none | openai (Whisper via OPENAI_API_KEY); voice never authorizes a merge

notifications:
  telegram:
    ready_for_owner: true
    max_attempts: 3               # bounded retries per notification (dedup key = PR + READY_FOR_OWNER + SHA)
    retry_backoff_seconds: 120

# Domains whose code changes make the regression gate mandatory.
regression_domains: [backend, geometry, validator, ai]
# Domains whose Issues change product behavior: every acceptance criterion of such an Issue needs
# deterministic evidence (TEST / REGRESSION / STATIC / ARTIFACT); SEMANTIC_REVIEW may only add to it.
behavior_domains: [backend, geometry, validator, frontend, ai]

commands:
  # Environment injected into every setup/test/smoke command and every worker/reviewer process,
  # unless the variable is already set. backend/app/main.py constructs OpenAI clients at import
  # time, so isolated environments (worktrees, smoke, CI) need a value; the deterministic suites
  # never call OpenAI and `production_ai` tests stay skipped, so an obviously-fake literal is right.
  env:
    OPENAI_API_KEY: not-a-real-key-agent-only
  # Run once after a worktree is created, keyed by the Issue's domains (backend deps are always
  # installed — nearly every verification target needs them; frontend only when relevant). The
  # local-model extra (torch/transformers/peft) is installed too so a worker's environment matches
  # the developer machine — tests/test_local_gateway.py imports torch, and without the extra a
  # worker cannot even run that test. Also used, unmodified, to set up the post-merge smoke worktree.
  worktree_setup:
    always:
      - {cwd: backend, cmd: "uv sync --group dev --extra local-model"}
    frontend:
      - {cwd: frontend, cmd: "npm ci --no-audit --no-fund"}
  fast_tests:
    backend: {cwd: backend, cmd: "uv run pytest -q -x -p no:cacheprovider -n 4", heavy: true}
    frontend: {cwd: frontend, cmd: "npm test", heavy: false}
  # Post-merge smoke on main: cheap, critical-path only. Never the corpus.
  smoke:
    - {cwd: backend, cmd: "uv run python -c 'import app.main'"}
    - {cwd: backend, cmd: "uv run pytest -q -p no:cacheprovider tests/test_projects.py tests/test_demo_p0.py tests/test_design.py"}
  regression:
    corpus_tests: {cwd: backend, cmd: "TEST_MODE=REGRESSION uv run pytest -q -p no:cacheprovider tests/regression_corpus -n 4", heavy: true}
    snapshot: {cwd: backend, cmd: "uv run python spikes/failure_log_sweep/corpus_snapshot.py", heavy: true}

timeouts:
  command_seconds: 1800             # any single setup/test command
  regression_seconds: 3600
  merge_wait_seconds: 600
