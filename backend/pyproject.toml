[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # app.vertical_slice.renderer — first vertical slice's floor-plan renderer (was present
    # transitively before this; declared explicitly so `uv sync` doesn't silently drop it).
    "matplotlib>=3.8.0",
    # app.geometry_domain.booleans — polygon booleans/offsetting via GEOS. Used instead of a
    # hand-written implementation: robust boolean geometry is where hand-rolled code fails
    # silently, and it is not the problem this product exists to solve.
    "shapely>=2.0",
]

[project.optional-dependencies]
# Only needed for ARCHITECT_MODEL_PROVIDER=local (app/architect/local_gateway.py) — loads the accepted
# Qwen2.5-Coder-7B-Instruct + LoRA adapter in-process. Not required for mock/remote, or for the test
# suite's unit tests (which inject a fake tokenizer/model — see tests/test_local_gateway.py) — but IS
# required for `import torch`'s `torch.no_grad()` context manager those tests still exercise.
local-model = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
]

# Only needed for KNOWLEDGE_EMBEDDING_PROVIDER=huggingface (app/knowledge/embeddings/
# huggingface_provider.py) — local sentence-transformers inference, CPU by default. Not required
# for the default hash/ollama/openai embedding providers, or for the hermetic knowledge test suite
# (which never constructs this provider without the extra installed — see
# tests/knowledge/test_huggingface_provider.py's skip guard).
knowledge-embeddings = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The production suite is `tests/` and only `tests/`. `spikes/` holds isolated throwaway proof
# code (see spikes/geometry_core/README.md) which must never become a production dependency or
# gate a production run — it is run on purpose, from its own directory, not swept up by a bare
# `pytest`. Naming a path explicitly (e.g. `pytest spikes/geometry_core`) still works.
testpaths = ["tests"]
# See tests/conftest.py's TEST_MODE gating and docs/AI_TEST_HARNESS.md. A plain `pytest` run
# collects none of these (deselected unless TEST_MODE says otherwise) — deterministic stays fast.
markers = [
    "local_ai: calls a local Ollama model (needs TEST_MODE=LOCAL_AI/FULL_AI/NIGHTLY)",
    "production_ai: calls the real OpenAI API, costs money (needs TEST_MODE=FULL_AI/NIGHTLY + OPENAI_API_KEY)",
    "regression: the full frozen-ProgramSpec-context regression corpus (needs TEST_MODE=REGRESSION/FULL_AI/NIGHTLY)",
    "nightly: reserved for a larger nightly-only evaluation set",
]
