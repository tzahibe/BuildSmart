<svg xmlns="http://www.w3.org/2000/svg" width="992" height="360" viewBox="0 0 992 360"><rect width="992" height="360" fill="#fff"/><text x="16" y="28" font-size="14" font-weight="bold" font-family="Helvetica,Arial" fill="#112">B06 — three conceptual partis</text><text x="16" y="44" font-size="9.5" font-family="Helvetica,Arial" fill="#a33">CONCEPTUAL DIAGRAMS — NOT validated floor plans. No dimension here has been solved or checked by any validator.</text><text x="16" y="58" font-size="9" font-family="Helvetica,Arial" fill="#556">3 bedrooms, 2 wet rooms, no safe room, not open-plan, 312 m² requested on a 13 × 24 m envelope. Production delivers 177 m² with the master at the</text><text x="16" y="70" font-size="9" font-family="Helvetica,Arial" fill="#556">garden, the living room at the street and a 27.6 m² unassigned block.</text><g transform="translate(16,114)"><text x="0" y="-18" font-size="11.5" font-weight="bold" font-family="Helvetica,Arial" fill="#112">A — rear public band</text><text x="0" y="-5" font-size="8" font-family="Helvetica,Arial" fill="#667">public band moved to the garden; a cross corridor, not a full-depth slot</text><text x="150.0" y="-30" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">STREET (north edge, parking + walk)</text><text x="150.0" y="244" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">GARDEN (rear)</text><rect x="0" y="0" width="190" height="42" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="95.0" y="24.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">ENTRY HALL</text><text x="95.0" y="36.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">arrival, street side</text><rect x="190" y="0" width="110" height="42" fill="#eceff1" stroke="#334" stroke-width="1.2"/><text x="245.0" y="24.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">STORE / WC</text><rect x="0" y="42" width="110" height="90" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="55.0" y="90.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BED 1</text><rect x="110" y="42" width="80" height="90" fill="#ede0f2" stroke="#334" stroke-width="1.2"/><text x="150.0" y="90.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BATH</text><rect x="190" y="42" width="110" height="90" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="245.0" y="90.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BED 2</text><line x1="6" y1="46" x2="294" y2="46" stroke="#b4651a" stroke-width="3.2" stroke-linecap="round"/><rect x="0" y="132" width="300" height="98" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="150.0" y="184.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LIVING / DINING / KITCHEN</text><text x="150.0" y="196.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">full width, opens to garden</text><circle cx="95" cy="2" r="5" fill="#fff" stroke="#b4651a" stroke-width="2"/><text x="95" y="5" font-size="7" text-anchor="middle" font-family="Helvetica,Arial" fill="#b4651a">E</text></g><g transform="translate(346,114)"><text x="0" y="-18" font-size="11.5" font-weight="bold" font-family="Helvetica,Arial" fill="#112">B — courtyard (C-plan)</text><text x="0" y="-5" font-size="8" font-family="Helvetica,Arial" fill="#667">the void is the organiser; every room gets two orientations</text><text x="150.0" y="-30" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">STREET (north edge, parking + walk)</text><text x="150.0" y="244" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">GARDEN (rear)</text><rect x="0" y="0" width="118" height="58" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="59.0" y="32.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">ENTRY</text><rect x="118" y="0" width="182" height="58" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="209.0" y="32.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">KITCHEN / DINING</text><rect x="0" y="58" width="90" height="172" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="45.0" y="147.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LIVING</text><text x="45.0" y="159.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">two-sided light</text><rect x="90" y="58" width="120" height="104" fill="#eef6e6" stroke="#8a9" stroke-width="1" stroke-dasharray="4 3"/><text x="150.0" y="113.0" font-size="8.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#475">COURTYARD</text><rect x="210" y="58" width="90" height="172" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="255.0" y="147.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BED 1 / BED 2</text><text x="255.0" y="159.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">bedroom arm</text><rect x="90" y="162" width="120" height="68" fill="#ede0f2" stroke="#334" stroke-width="1.2"/><text x="150.0" y="199.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BATH + MASTER</text><line x1="92" y1="60" x2="92" y2="226" stroke="#b4651a" stroke-width="3.2" stroke-linecap="round"/><circle cx="58" cy="2" r="5" fill="#fff" stroke="#b4651a" stroke-width="2"/><text x="58" y="5" font-size="7" text-anchor="middle" font-family="Helvetica,Arial" fill="#b4651a">E</text></g><g transform="translate(676,114)"><text x="0" y="-18" font-size="11.5" font-weight="bold" font-family="Helvetica,Arial" fill="#112">C — two volumes on a link</text><text x="0" y="-5" font-size="8" font-family="Helvetica,Arial" fill="#667">public and private as separate masses joined by a glazed link</text><text x="150.0" y="-30" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">STREET (north edge, parking + walk)</text><text x="150.0" y="244" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">GARDEN (rear)</text><rect x="0" y="0" width="130" height="110" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="65.0" y="58.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LIVING / DINING</text><text x="65.0" y="70.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">street volume</text><rect x="130" y="0" width="40" height="230" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="150.0" y="118.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LINK</text><text x="150.0" y="130.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">glazed</text><text x="150.0" y="139.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">joint</text><rect x="170" y="0" width="130" height="110" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="235.0" y="58.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">KITCHEN</text><rect x="0" y="110" width="130" height="120" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="65.0" y="173.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">MASTER + BATH</text><text x="65.0" y="185.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">garden volume</text><rect x="170" y="110" width="130" height="120" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="235.0" y="173.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BED 1 / BED 2</text><circle cx="150" cy="2" r="5" fill="#fff" stroke="#b4651a" stroke-width="2"/><text x="150" y="5" font-size="7" text-anchor="middle" font-family="Helvetica,Arial" fill="#b4651a">E</text></g></svg>