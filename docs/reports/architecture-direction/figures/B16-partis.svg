<svg xmlns="http://www.w3.org/2000/svg" width="992" height="360" viewBox="0 0 992 360"><rect width="992" height="360" fill="#fff"/><text x="16" y="28" font-size="14" font-weight="bold" font-family="Helvetica,Arial" fill="#112">B16 — three conceptual partis</text><text x="16" y="44" font-size="9.5" font-family="Helvetica,Arial" fill="#a33">CONCEPTUAL DIAGRAMS — NOT validated floor plans. No dimension here has been solved or checked by any validator.</text><text x="16" y="58" font-size="9" font-family="Helvetica,Arial" fill="#556">5 bedrooms + safe room (MAMAD), 3 wet rooms, open-plan, 216 m² on a wide 18 × 12 m envelope. Production delivers 188 m² with all three public rooms on</text><text x="16" y="70" font-size="9" font-family="Helvetica,Arial" fill="#556">the west side and an 11.9 : 1 corridor.</text><g transform="translate(16,114)"><text x="0" y="-18" font-size="11.5" font-weight="bold" font-family="Helvetica,Arial" fill="#112">A — street gallery, garden bedrooms</text><text x="0" y="-5" font-size="8" font-family="Helvetica,Arial" fill="#667">circulation along the street wall becomes the acoustic buffer</text><text x="150.0" y="-30" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">STREET (north edge, parking + walk)</text><text x="150.0" y="244" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">GARDEN (rear)</text><rect x="0" y="0" width="300" height="46" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="150.0" y="26.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">ENTRY GALLERY</text><text x="150.0" y="38.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">along the street wall</text><rect x="0" y="46" width="96" height="92" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="48.0" y="95.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LIVING</text><rect x="96" y="46" width="96" height="92" fill=