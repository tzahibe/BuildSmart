18" font-size="11.5" font-weight="bold" font-family="Helvetica,Arial" fill="#112">B — service corner + cross spine</text><text x="0" y="-5" font-size="8" font-family="Helvetica,Arial" fill="#667">the MAMAD is put where no room wants to be: the street corner</text><text x="150.0" y="-30" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">STREET (north edge, parking + walk)</text><text x="150.0" y="244" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">GARDEN (rear)</text><rect x="0" y="0" width="150" height="50" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="75.0" y="28.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">FOYER</text><rect x="150" y="0" width="150" height="50" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="225.0" y="28.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">MAMAD + BATH</text><text x="225.0" y="40.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">service corner at the street</text><rect x="0" y="50" width="300" height="10" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="150.0" y="58.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112"></text><rect x="0" y="60" width="110" height="170" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="55.0" y="148.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BED 1-3 stack</text><text x="55.0" y="160.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">quiet wing</text><rect x="110" y="60" width="70" height="170" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="145.0" y="148.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">SPINE</text><rect x="180" y="60" width="120" height="110" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="240.0" y="118.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LIVING / DINING</text><rect x="180" y="170" width="120" height="60" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="240.0" y="203.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">KITCHEN</text><line x1="178" y1="58" x2="178" y2="226" stroke="#b4651a" stroke-width="3.2" stroke-linecap="round"/><circle cx="75" cy="2" r="5" fill="#fff" stroke="#b4651a" stroke-width="2"/><text x="75" y="5" font-size="7" text-anchor="middle" font-family="Helvetica,Arial" fill="#b4651a">E</text></g><g transform="translate(676,114)"><text x="0" y="-18" font-size="11.5" font-weight="bold" font-family="Helvetica,Arial" fill="#112">C — L around a patio</text><text x="0" y="-5" font-size="8" font-family="Helvetica,Arial" fill="#667">the wide envelope's natural parti; two wings, one outdoor room</text><text x="150.0" y="-30" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">STREET (north edge, parking + walk)</text><text x="150.0" y="244" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#667">GARDEN (rear)</text><rect x="0" y="0" width="105" height="60" fill="#fbe9c6" stroke="#334" stroke-width="1.2"/><text x="52.5" y="33.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">ENTRY</text><rect x="105" y="0" width="195" height="60" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="202.5" y="33.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">KITCHEN / DINING</text><rect x="0" y="60" width="105" height="170" fill="#cfe3f7" stroke="#334" stroke-width="1.2"/><text x="52.5" y="148.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">LIVING</text><rect x="105" y="60" width="105" height="90" fill="#eef6e6" stroke="#8a9" stroke-width="1" stroke-dasharray="4 3"/><text x="157.5" y="108.0" font-size="8.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#475">PATIO</text><rect x="210" y="60" width="90" height="90" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="255.0" y="108.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">MASTER + BATH</text><rect x="105" y="150" width="195" height="80" fill="#dfeedd" stroke="#334" stroke-width="1.2"/><text x="202.5" y="193.0" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#112">BED 1-3 + MAMAD</text><text x="202.5" y="205.0" font-size="7.5" text-anchor="middle" font-family="Helvetica,Arial" fill="#556">garden-side children's wing</text><line x1="110" y1="150" x2="295" y2="150" stroke="#b4651a" stroke-width="3.2" stroke-linecap="round"/><line x1="103" y1="60" x2="103" y2="228" stroke="#b4651a" stroke-width="3.2" stroke-linecap="round"/><circle cx="52" cy="2" r="5" fill="#fff" stroke="#b4651a" stroke-width="2"/><text x="52" y="5" font-size="7" text-anchor="middle" font-family="Helvetica,Arial" fill="#b4651a">E</text></g></svg>